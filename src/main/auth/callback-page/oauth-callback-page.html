<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} - ChunkShare</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #101210;
        color: #f3f4ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 12% 6%, rgba(91, 255, 91, 0.08), transparent 28rem),
          radial-gradient(circle at 86% 88%, rgba(91, 255, 91, 0.08), transparent 30rem), #101210;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        text-align: center;
      }

      .brand {
        margin: 0 0 1.75rem;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand span {
        color: #89ff5a;
      }

      .card {
        padding: 2.5rem 2.25rem;
        border: 1px solid rgba(137, 255, 90, 0.24);
        border-radius: 0.75rem;
        background: #1e1e1e;
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
      }

      .icon {
        width: 6rem;
        height: 6rem;
        margin: 0 auto 1.75rem;
        color: #89ff5a;
      }

      .is-error .icon {
        color: #ff6666;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1.15;
        font-weight: 750;
      }

      .message {
        max-width: 22rem;
        margin: 1.25rem auto 0;
        color: #d7ddcf;
        font-size: 1rem;
        line-height: 1.55;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(137, 255, 90, 0.2);
        color: #f0f2e8;
        font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 0.875rem;
      }

      .meta-icon {
        width: 1.35rem;
        height: 1.35rem;
        color: #89ff5a;
      }

      .is-error .meta-icon {
        color: #ff6666;
      }

      .hint {
        margin: 1.75rem 0 0;
        color: #a3ad9b;
        font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="{{STATE_CLASS}}">
      <p class="brand">Chunk<span>Share</span></p>
      <section class="card" aria-labelledby="callback-title">
        <div class="icon" aria-hidden="true">{{ICON_SVG}}</div>
        <h1 id="callback-title">{{TITLE}}</h1>
        <p class="message">{{MESSAGE}}</p>
        <div class="meta">
          <span class="meta-icon" aria-hidden="true">{{META_ICON_SVG}}</span>
          <span>{{META_TEXT}}</span>
        </div>
      </section>
      <p class="hint">{{HINT}}</p>
    </main>
  </body>
</html>
